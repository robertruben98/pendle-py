[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pendle-py"
version = "0.1.0"
description = "Typed Python client for the Pendle Finance v2 API (PT/YT markets, APYs, and swap/LP/mint/redeem calldata)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Robert Ruben" }]
keywords = ["pendle", "yield", "pt", "yt", "defi", "evm", "apy", "calldata"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
exec = [
    "web3>=6.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
    "mypy>=1.8",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/robertruben98/pendle-py"
Repository = "https://github.com/robertruben98/pendle-py"
Documentation = "https://api-v2.pendle.finance/core/docs"
Issues = "https://github.com/robertruben98/pendle-py/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pendle"]

[tool.hatch.build.targets.sdist]
include = ["src/pendle", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "SIM"]
# UP007/UP045 would push to PEP 604 `X | None`, and UP006 to bare `list`/`dict`,
# in annotations that pydantic re-evaluates at runtime on Python 3.9. Keep
# typing.Optional/Union/List/Dict so the models build cleanly on 3.9.
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.isort]
# Pin first-party packages so import ordering is deterministic whether or not
# the package is installed in the linting environment (CI vs. local editable).
known-first-party = ["pendle", "tests"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: live network tests against the real Pendle API (deselected by default)",
]
addopts = "-m 'not integration'"
